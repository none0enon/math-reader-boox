name: Patch lecture sync triggers once

on:
  push:
    branches: [fix/lecture-cloud-sync-triggers]
    paths:
      - '.github/workflows/patch-lecture-sync-triggers-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/lecture-cloud-sync-triggers

      - name: Make lecture reading progress local-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/assets/www/index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          pending_line = '            _lectureProgressSyncPending = true;\n'
          if pending_line not in text:
              raise SystemExit('lecture progress pending marker assignment not found')
          text = text.replace(pending_line, '', 1)

          pattern = re.compile(
              r"        // 有尚未推送到云端的讲义阅读进度\n"
              r"        let _lectureProgressSyncPending = false;\n"
              r"        function flushLectureProgressSync\(\) \{\n"
              r"            flushLectureProgressSave\(\);\n"
              r"            if \(!_lectureProgressSyncPending\) return;\n"
              r"            _lectureProgressSyncPending = false;\n"
              r"            triggerSyncOnFileChange\(null, 'metadata_update'\);\n"
              r"        \}\n"
          )
          replacement = (
              "        // 讲义阅读进度只保存在本地；打开、滚动、关闭或切后台都不得触发云同步。\n"
              "        function flushLectureProgressSync() {\n"
              "            flushLectureProgressSave();\n"
              "        }\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'lecture progress cloud flush block match count: {count}')

          text = text.replace(
              '            // 阅读期间的进度只写本地，退出时统一推一次，多设备仍能接上进度，\n'
              '            // 但一次阅读最多产生一次同步而不是每滚动一下一次。\n',
              '            // 阅读进度只写本地；退出讲义不触发云同步。\n'
          )

          if "_lectureProgressSyncPending" in text:
              raise SystemExit('stale _lectureProgressSyncPending reference remains')
          if "function flushLectureProgressSync() {\n            flushLectureProgressSave();\n            triggerSyncOnFileChange(null, 'metadata_update');" in text:
              raise SystemExit('lecture progress flush still triggers metadata sync')
          if text == original:
              raise SystemExit('no changes made')

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-lecture-sync-triggers-once.yml

      - name: Commit patch to fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/index.html .github/workflows/patch-lecture-sync-triggers-once.yml
          git commit -m "fix: keep lecture reading progress local-only"
          git push origin HEAD:fix/lecture-cloud-sync-triggers
